[project]
name = "ha-hattrick-integration"
version = "0.1.0"
description = "Custom integration di Home Assistant per Hattrick via API CHPP"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["custom_components"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "ASYNC", # flake8-async
    "PLE",   # pylint errors
    "PLW",   # pylint warnings
    "RUF",   # ruff rules
]
ignore = [
    "PLR2004", # magic value comparison (ok nei test e nelle costanti di dominio)
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
